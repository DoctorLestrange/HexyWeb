name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (leave blank to use v<package.json version>)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve version and release tag
        id: meta
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_NAME="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG_NAME="${{ inputs.tag }}"
          else
            TAG_NAME="v${PKG_VERSION}"
          fi
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Type-check, test, and build
        env:
          NODE_ENV: production
        run: |
          npm run lint
          npm test
          npm run build

      - name: Package static web release archives
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p release-artifacts
          (cd dist && zip -r "../release-artifacts/hexy-web-${VERSION}.zip" .)
          tar -C dist -czf "release-artifacts/hexy-web-${VERSION}.tar.gz" .
          (cd release-artifacts && sha256sum hexy-web-* > checksums.sha256)
          cat release-artifacts/checksums.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: Hexy ${{ steps.meta.outputs.tag_name }}
          generate_release_notes: true
          body: |
            ### Static Web Bundle Downloads
            - **ZIP**: `hexy-web-${{ steps.meta.outputs.version }}.zip` — extract and host on any static web server (GitHub Pages, Netlify, Cloudflare Pages, Nginx, etc.).
            - **Tarball**: `hexy-web-${{ steps.meta.outputs.version }}.tar.gz` — extract (`tar -xzf hexy-web-*.tar.gz`) and serve statically.
            - **Checksums**: Verify downloads against `checksums.sha256`.
          files: |
            release-artifacts/hexy-web-*.zip
            release-artifacts/hexy-web-*.tar.gz
            release-artifacts/checksums.sha256
